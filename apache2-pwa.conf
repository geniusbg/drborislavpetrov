# Apache2 конфигурация за PWA с PM2
# Копирай в /etc/apache2/sites-available/drborislavpetrov.conf

<VirtualHost *:80>
    ServerName your-domain.com
    ServerAlias www.your-domain.com
    Redirect permanent / https://your-domain.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName your-domain.com
    ServerAlias www.your-domain.com
    
    # SSL настройки
    SSLEngine on
    SSLCertificateFile /path/to/your/cert.pem
    SSLCertificateKeyFile /path/to/your/private.key
    
    # SSL протоколи за PWA
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder off
    SSLSessionTickets off

    # Proxy към PM2 приложението
    ProxyPreserveHost On
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/
    
    # WebSocket поддръжка за Socket.io
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://localhost:3000/$1" [P,L]
    
    # PWA headers - КРИТИЧНО!
    <Location />
        # Основни PWA headers
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </Location>
    
    # Service Worker - БЕЗ кеширане! (КРИТИЧНО за PWA)
    <LocationMatch "^/sw\.js$">
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
        Header always set Pragma "no-cache"
        Header always set Expires "0"
        Header always set Content-Type "application/javascript"
    </LocationMatch>
    
    # Manifest файлове - с кеширане
    <LocationMatch "^/(manifest|admin-manifest)\.json$">
        Header always set Cache-Control "public, max-age=31536000, immutable"
        Header always set Content-Type "application/manifest+json"
    </LocationMatch>
    
    # Next.js static files (_next/static) - КРИТИЧНО за правилно обслужване
    <LocationMatch "^/_next/static/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
        Header always set Content-Type "application/javascript"
        # Ensure proper MIME type for JS files
        <FilesMatch "\.js$">
            Header always set Content-Type "application/javascript"
        </FilesMatch>
        <FilesMatch "\.css$">
            Header always set Content-Type "text/css"
        </FilesMatch>
    </LocationMatch>
    
    # Icons и статични файлове - с кеширане
    <LocationMatch "\.(png|jpg|jpeg|gif|ico|svg|css|js)$">
        Header always set Cache-Control "public, max-age=31536000, immutable"
        # Ensure proper MIME types
        <FilesMatch "\.js$">
            Header always set Content-Type "application/javascript"
        </FilesMatch>
        <FilesMatch "\.css$">
            Header always set Content-Type "text/css"
        </FilesMatch>
    </LocationMatch>
    
    # API routes - без кеширане
    <LocationMatch "^/api/">
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
        Header always set Pragma "no-cache"
        Header always set Expires "0"
    </LocationMatch>
    
    # Socket.io - специални настройки
    <LocationMatch "^/socket\.io/">
        # WebSocket поддръжка вече е настроена горе
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
    </LocationMatch>
    
    # Gzip компресия за PWA
    LoadModule deflate_module modules/mod_deflate.so
    <Location />
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \
            \.(?:gif|jpe?g|png)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \
            \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \.pdf$ no-gzip dont-vary
    </Location>
    
    # Security headers за PWA
    <Location />
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        # CSP се задава от приложението (middleware), не от Apache
    </Location>
    
    # Логове
    ErrorLog ${APACHE_LOG_DIR}/drborislavpetrov_error.log
    CustomLog ${APACHE_LOG_DIR}/drborislavpetrov_access.log combined
</VirtualHost>
